menetelman_versio: "0.2"
tila: "kalibrointia_odottava_luonnos"
paivitetty: "2026-09-04"
tarkoitus: "Yhden Suomessa toimivan tai Suomen markkinaan dokumentoidusti tulevan toimijan roolikohtainen arviointi ilman automaattista paremmuusjärjestystä."
hyvaksyntaportit:
  painojen_perustelut_dokumentoitu: true
  laskentasaanto_testattu: true
  lahde_ja_esteellisyyssaannot_dokumentoitu: true
  korjaus_ja_vastineprosessi_dokumentoitu: true
  kahden_riippumattoman_arvioijan_kalibrointi: false
  omistajan_hyvaksynta_nimettyihin_arvioihin: false
  saanto: "Nimettyjä toimijoita ei arvioida ennen kuin kaikki portit ovat true."
arviointiyksikko:
  sallitut:
    - "oikeushenkilö"
    - "osuuskunta"
    - "yhteenliittymä"
    - "sopimuksellisesti erillinen liiketoimintayksikkö"
  saanto: "Arviointiyksikön pitää kantaa tai dokumentoidun suunnitelman perusteella valmistautua kantamaan tarkasteltavan palvelun vastuu."
kelpoisuusseula:
  ehdot:
    - id: TUNNISTETTAVA_TOIMIJA
      ehto: "Oikeushenkilö, jäsenpohjainen yhteisö, yhteenliittymä tai sopimuksellisesti erotettu liiketoimintayksikkö voidaan nimetä."
    - id: OLENNAINEN_VASTUU
      ehto: "Julkinen näyttö osoittaa oman palvelusopimuksen, jatkuvan kapasiteetti- tai tietopalveluvastuun, palvelutason, mittauksen ja laskutuksen, häiriönhallinnan, valtuutusten hallinnan tai tuotteistetun tukkupalvelun."
    - id: ULKOINEN_PALVELUSUHDE
      ehto: "Palvelulla on ulkoinen asiakas, jäsenkunta tai ennalta määritelty palveluyhteisö."
    - id: JATKUVA_OPEROINTI
      ehto: "Vastuu jatkuu toimitusprojektin jälkeen ja sisältää vähintään kaksi jatkuvan palvelun tehtävää."
    - id: TUOTTEISTETTU_PALVELU
      ehto: "Kohderyhmä, toimitussisältö ja sopimus- tai hinnoitteluperiaate on kuvattu."
    - id: ARVIOITAVUUS
      ehto: "Vähintään yhden roolin pakollisista muuttujista on julkista näyttöä."
  paatossaanto: "Kaikki kyllä = jatkoon; yksikin tuntematon = rajatapaus; yksikin olennainen ei = ulos rajattu."
arvioinnin_tilat:
  tuntematon: "Julkinen näyttö ei riitä myönteiseen tai kielteiseen arvioon. Ei ole pistemäärä."
  ei_sovellu: "Muuttuja ei ole kyseisessä roolissa merkityksellinen; erillinen perustelu vaaditaan."
asteikko:
  0: "Lähteistetty näyttö siitä, että kyky puuttuu tai olennainen este on olemassa"
  1: "Erittäin heikko lähtöasema"
  2: "Osittainen kyvykkyys ja suuret puutteet"
  3: "Uskottava lähtöasema, mutta olennaisia kehitystarpeita"
  4: "Vahva lähtöasema"
  5: "Poikkeuksellisen valmis kyvykkyys"
luottamus:
  A: "Vahva suora tai useasta riippumattomasta lähteestä vahvistettu näyttö"
  B: "Hyvä suora näyttö tai yksi vahva ensisijainen lähde"
  C: "Rajallinen tai pääosin epäsuora näyttö"
  D: "Heikko näyttö; tulosta ei saa käyttää ilman näkyvää varoitusta"
laskenta:
  roolit:
    - token
    - tieto
    - yhdistelma
    - virtuaali
  minimi_nayttokattavuus_prosenttia: 70
  suurin_ei_sovellu_paino_prosenttia: 20
  tuloksen_desimaalit: 2
  tuntematon: "Poistetaan tunnetun painon nimittäjästä mutta säilytetään soveltuvassa painossa, jolloin näyttökattavuus pienenee."
  ei_sovellu: "Poistetaan sekä soveltuvasta että tunnetusta painosta; perustelu vaaditaan."
  pistekaava: "summa(paino * piste) / tunnettujen muuttujien painojen summa"
  kattavuuskaava: "100 * tunnettujen muuttujien painojen summa / soveltuvien muuttujien painojen summa"
  luottamus_vaikuttaa_pisteeseen: false
  ratkaisematon_olennainen_lahderistiriita_estaa_tuloksen: true
  herkkyys:
    muutos_prosenttia: 20
    varoitusraja_pistetta: 0.25
    saanto: "Muuta yhtä tunnettua painoa kerrallaan ±20 prosenttia, suhteuta muut tunnetut painot uudelleen ja raportoi tulosväli."
pakolliset_muuttujat:
  token: [KAPASITEETTI, RAHOITUS, AVOIMET_MALLIT, TURVALLISUUS, TUKI]
  tieto: [TIETOYDIN, OMISTUS, SIIRRETTAVYYS, TURVALLISUUS, INTEGRAATIO]
  yhdistelma: [KAPASITEETTI, TIETOYDIN, OMISTUS, SIIRRETTAVYYS, TURVALLISUUS, OPEROINNIN_EROTTELU]
  virtuaali: [ASIAKAS, SIIRRETTAVYYS, TOIMIALA, OPEROINNIN_EROTTELU, TUKI]
