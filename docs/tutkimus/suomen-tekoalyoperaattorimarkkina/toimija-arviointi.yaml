  - "Tunnistettava oikeudellinen tai operatiivinen identiteetti"
  - "Julkinen näyttö vähintään yhdestä operaattorille olennaisesta vastuusta tai valmiudesta"
  - "Ulkoinen asiakas, jäsenkunta tai määritelty palveluyhteisö"
  - "Jatkuva operointi tai tuotteistettu palvelu, ei vain yksittäinen projekti"
  - "Arvioitavissa vähintään yhdessä roolissa ilman puuttuvan tiedon muuttamista oletukseksi"
